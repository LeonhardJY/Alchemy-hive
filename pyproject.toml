[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemy-hive"
version = "0.1.0"
description = "把微信/Telegram/WhatsApp/Instagram/Facebook 聊天记录蒸馏成有活人感的 AI 人物，一键导出 buzz .agent.json"
readme = "README.md"
license = "MIT"
authors = [{name = "LeonhardJY"}]
keywords = ["wechat", "telegram", "whatsapp", "instagram", "persona", "llm", "agent", "distill", "buzz"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["typer>=0.12", "pydantic>=2.5", "httpx>=0.27", "tomli>=2; python_version < '3.11'", "pywebview>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/LeonhardJY/Alchemy-hive"
Issues = "https://github.com/LeonhardJY/Alchemy-hive/issues"

[project.scripts]
alchemy-hive = "alchemy_hive.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
