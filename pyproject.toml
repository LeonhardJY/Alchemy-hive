[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weflow-agent"
version = "0.1.0"
description = "从 WeFlow 导出的微信聊天蒸馏人物 AI agent，一键导出 buzz .agent.json"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2.5", "pyyaml>=6", "httpx>=0.27", "tomli>=2; python_version < '3.11'", "ttkbootstrap>=1.10", "pywebview>=5.0"]

[project.scripts]
weflow-agent = "weflow_agent.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
