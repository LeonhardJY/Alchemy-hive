[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemy-hive"
version = "0.1.0"
description = "Turn chat history into AI personas — distill from WeChat/Telegram/WhatsApp/Instagram into any agent platform"
readme = "README.md"
license = "MIT"
authors = [{name = "LeonhardJY"}]
keywords = ["chat", "persona", "llm", "agent", "distill", "wechat", "telegram", "whatsapp", "ai", "buzz", "silvertavern"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["typer>=0.12", "pydantic>=2.5", "httpx>=0.27", "tomli>=2; python_version < '3.11'", "pywebview>=5.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/LeonhardJY/Alchemy-hive"
Issues = "https://github.com/LeonhardJY/Alchemy-hive/issues"

[project.scripts]
alchemy-hive = "alchemy_hive.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
